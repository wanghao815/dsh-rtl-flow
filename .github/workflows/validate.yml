name: Validate package and ORFS environment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_orfs:
        description: Acquire official ORFS image on this remote runner and read platform libraries only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rtl-flow-validation
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 scripts/ci-resources.py package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.4.0
      - name: Prepare bounded simulation-test prerequisite
        timeout-minutes: 5
        run: |
          if ! command -v verilator >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends verilator
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - name: Check, test and pack once
        run: python3 scripts/ci-pack.py
        timeout-minutes: 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-${{ github.sha }}
          retention-days: 3
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.tgz
            artifacts/SHA256SUMS

  orfs-libraries:
    if: (github.event_name == 'workflow_dispatch' && inputs.check_orfs) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[orfs-check]'))
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 scripts/ci-resources.py backend
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.4.0
      - name: Guarded environment and library check only
        timeout-minutes: 20
        run: sudo --preserve-env=RUNNER_TEMP "$(command -v node)" scripts/ci-backend.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orfs-libraries-${{ github.sha }}
          retention-days: 3
          path: |
            artifacts/*.json
            artifacts/*.log
